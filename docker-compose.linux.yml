services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_MODE: PAPER
      PORT: 8787
      DB_PATH: /app/data/trading-v34.sqlite
      LOCAL_VAULT_KEY_PATH: /app/data/.integration-vault-key
      DEFAULT_WORKSPACE_ID: default
    volumes:
      - v34_data:/app/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_V34_API_BASE: /backend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Security default: do not expose trading controls directly to the Internet.
    # Reach it through an SSH tunnel or a private VPN such as Tailscale.
    ports:
      - "127.0.0.1:8080:80"

volumes:
  v34_data:
