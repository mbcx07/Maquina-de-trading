server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /backend/api/stream/ {
    proxy_pass http://backend:8787/api/stream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    add_header Cache-Control "no-cache, no-transform" always;
    add_header X-Accel-Buffering "no" always;
  }

  location /backend/ {
    proxy_pass http://backend:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
  }

  # Safe host updater: fixed local Unix socket, no Docker socket and no generic shell endpoint.
  location /updater/ {
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header Connection "";
    proxy_pass http://unix:/run/quantum-updater/agent.sock:/;
    proxy_connect_timeout 5s;
    proxy_read_timeout 1800s;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  location = /release.txt {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
