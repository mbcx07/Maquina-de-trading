name: R31 entry and exit optimization lab

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v34-dual-market-engine
    paths:
      - backend/src/emaFibLimitR29MacdCancelLab.ts
      - .github/workflows/r29-macd-cancel.yml

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run 2,160 entry and exit combinations over 56 days
        env:
          R29_DAYS: 56
          R29_CONCURRENCY: 3
        run: npx tsx src/emaFibLimitR29MacdCancelLab.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r31-entry-exit-grid
          path: backend/artifacts/r31-entry-exit-grid.json
          if-no-files-found: warn
