name: R26 Regime Basket Optimizer
on:
  push:
    branches: [feature/v34-dual-market-engine]
    paths:
      - 'backend/src/regimeBasketR26Lab.ts'
      - '.github/workflows/r26-regime-basket.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx src/regimeBasketR26Lab.ts
