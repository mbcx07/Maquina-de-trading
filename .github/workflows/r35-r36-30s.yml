name: R35-R36 causal 30-second research

on:
  push:
    branches: [feature/v34-dual-market-engine]
    paths:
      - backend/labs/r35_30s_causal.py
      - backend/labs/r36_confirmed_structure.py
      - .github/workflows/r35-r36-30s.yml
  workflow_dispatch:

jobs:
  causal-30s:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            backend/artifacts/r35-daily
            backend/artifacts/r35-XAUUSDT-30s-2026-09-01-56d.pkl
          key: r35-xau-30-second-2026-09-01-56d-v1
          save-always: true
      - run: pip install numpy pandas scikit-learn
      - name: Run causal 30-second entry research
        env:
          R35_END_DATE: "2026-09-01"
          R35_DAYS: "56"
        run: python labs/r35_30s_causal.py
      - name: Audit confirmed support and resistance placement
        run: python labs/r36_confirmed_structure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r35-r36-causal-30s-research
          path: |
            backend/artifacts/r35-30s-development.json
            backend/artifacts/r35-30s-trades.json
            backend/artifacts/r36-confirmed-structure.json
            backend/artifacts/r36-trades.json
          if-no-files-found: warn
