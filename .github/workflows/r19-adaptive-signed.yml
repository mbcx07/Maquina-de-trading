name: R19 Adaptive Signed Weights
on:
  workflow_dispatch:
  push:
    branches: [feature/v34-dual-market-engine]
    paths:
      - '.github/workflows/r19-adaptive-signed.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Signed online weights, inverted weak strategies, 6m max hold
        run: |
          sed -i "s/DAYS=14,H=6/DAYS=14,H=12/" src/adaptiveEnsemble100R19Fast.ts
          sed -i "s/const net=(v.side==='BUY'?rr:-rr)-COST/const net=(v.side==='BUY'?rr:-rr)/" src/adaptiveEnsemble100R19Fast.ts
          sed -i "s@return Math.min(3,Math.max(0,(s.hit-.5)\*3)+Math.max(0,s.edge/COST))@return Math.max(-3,Math.min(3,(s.hit-.5)*3+s.edge/.03))@" src/adaptiveEnsemble100R19Fast.ts
          python - <<'PY'
          from pathlib import Path
          p=Path('src/adaptiveEnsemble100R19Fast.ts')
          s=p.read_text()
          old="if(!q)continue;if(x.side==='BUY'){bw+=q;bc++;bf.add(x.family)}else{sw+=q;sc++;sf.add(x.family)}"
          new="if(!q)continue;const eside:S=q>=0?x.side:(x.side==='BUY'?'SELL':'BUY'),aq=Math.abs(q);if(eside==='BUY'){bw+=aq;bc++;bf.add(x.family)}else{sw+=aq;sc++;sf.add(x.family)}"
          if old not in s: raise SystemExit('weight loop pattern not found')
          p.write_text(s.replace(old,new).replace('lead:1.35','lead:1.20'))
          PY
          npx tsx src/adaptiveEnsemble100R19Fast.ts
