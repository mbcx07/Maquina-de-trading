name: R15 Commodity Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v34-dual-market-engine
    paths:
      - 'backend/src/commodityStrategyR15.ts'
      - 'backend/src/r15CommodityBenchmark.ts'
      - '.github/workflows/r15-commodity-benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx src/r15CommodityBenchmark.ts
