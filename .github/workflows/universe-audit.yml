name: V33.5 Binance Universe Audit

# GitHub-hosted US runners receive HTTP 451 from Binance USD-M market endpoints.
# Production qualification therefore runs automatically inside the Linux V34 VPS.
# Keep this workflow only for a future self-hosted runner in an allowed region.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Audit all eligible Binance USD-M perpetuals
        working-directory: backend
        env:
          AUDIT_DAYS: '14'
          AUDIT_STEP_MINUTES: '5'
          AUDIT_COST_PCT: '0.12'
        run: npx tsx src/universeAuditCli.ts
