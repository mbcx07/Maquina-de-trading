name: XAU Ensemble100 R18 Lab

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v34-dual-market-engine
    paths:
      - 'backend/src/xauEnsemble100R18Lab.ts'
      - '.github/workflows/xau-ensemble100-r18.yml'

jobs:
  ensemble100-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run 100-strategy confluence blind backtest
        run: npx tsx src/xauEnsemble100R18Lab.ts
