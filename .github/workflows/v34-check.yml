name: V34 Check

on:
  push:
    branches:
      - feature/v34-dual-market-engine
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run typecheck
      - run: npm run selftest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

  linux-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.linux.yml config
      - run: docker compose -f docker-compose.linux.yml build

  secret-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure frontend has no embedded private trading/data secrets
        run: |
          if grep -E 'apiSecret\s*=|BINANCE_API_SECRET\s*=.+[^=[:space:]]|TWELVE_DATA_API_KEY\s*=.+[^=[:space:]]' services/binance.ts App.tsx; then
            echo 'Potential private credential found in frontend source'
            exit 1
          fi
