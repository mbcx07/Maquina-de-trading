name: R27 EMA Fibonacci Limit
on:
  push:
    branches: [feature/v34-dual-market-engine]
    paths:
      - 'backend/src/emaFibLimitR27Lab.ts'
      - '.github/workflows/r27-ema-fib-limit.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run EMA Fibonacci limit blind backtest
        env:
          R27_CONCURRENCY: '3'
        run: npx tsx src/emaFibLimitR27Lab.ts
      - name: Upload operation audit
        uses: actions/upload-artifact@v4
        with:
          name: r27-ema-fib-limit-trades
          path: backend/artifacts/r27-trades.json
