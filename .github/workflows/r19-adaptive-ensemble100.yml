name: R19 Adaptive Ensemble100

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v34-dual-market-engine
    paths:
      - 'backend/src/adaptiveEnsemble100R19Lab.ts'
      - '.github/workflows/r19-adaptive-ensemble100.yml'

jobs:
  adaptive-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run adaptive 100-strategy leak-free backtest
        run: npx tsx src/adaptiveEnsemble100R19Lab.ts
