name: R15 XAU Survivor Validation

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v34-dual-market-engine
    paths:
      - 'backend/src/r15XauSurvivorValidation.ts'
      - '.github/workflows/r15-xau-survivor-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx src/r15XauSurvivorValidation.ts
