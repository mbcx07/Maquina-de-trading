name: R22 Scalper TSMOM
on:
  push:
    branches: [feature/v34-dual-market-engine]
    paths:
      - 'backend/src/scalperTsmomR22Lab.ts'
      - '.github/workflows/r22-scalper-tsmom.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx src/scalperTsmomR22Lab.ts