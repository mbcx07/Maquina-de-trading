name: R23 AI Monster V6 M10
on:
  push:
    branches: [feature/v34-dual-market-engine]
    paths:
      - 'backend/src/aiMonsterV6M10R23Lab.ts'
      - '.github/workflows/r23-ai-monster-v6-m10.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx src/aiMonsterV6M10R23Lab.ts
