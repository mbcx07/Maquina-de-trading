name: R20 MultiTF Consensus
on:
  push:
    branches: [feature/v34-dual-market-engine]
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: backend
      - run: npx tsx src/multiTfConsensusR20Lab.ts
        working-directory: backend
