name: R23 Winrate 65 Lab
on:
  push:
    branches: [feature/v34-dual-market-engine]
    paths:
      - 'backend/src/scalperR23WinrateLab.ts'
      - '.github/workflows/r23-winrate-lab.yml'
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run R23 blind winrate laboratory
        env:
          R23_CONCURRENCY: '6'
        run: npx tsx src/scalperR23WinrateLab.ts
